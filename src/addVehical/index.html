<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        font-family: "Poppins", sans-serif;
      }
    </style>
    <title>Document</title>
  </head>
  <body>
    <header>
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <span style="display: flex">
          <img
            style="height: 6vh"
            src="https://png.pngtree.com/png-vector/20220521/ourmid/pngtree-car-parking-symbol-for-designated-parking-area-vehicle-automobile-p-vector-png-image_45677364.jpg"
          />
          <p>XYZ Parking Mumbai</p>
        </span>
        <span style="display: flex; column-gap: 15px">
          <a href="../../index.html">Home</a>
          <a href="../about/index.html">About</a>
          <a href="../addVehical/index.html">Add Vehical</a>
        </span>
      </div>
      <hr />
    </header>

    <section>
      <form
        id="vehicleForm"
        style="
          background-color: rgb(227, 226, 226);
          border-radius: 5px;
          padding: 1px 10px;
        "
      >
        <h3>Add New Car</h3>
        <div>
          <label for="vehicleType">Vehicle Type</label>
          <select id="vehicleType">
            <option value="bike">Bike (1% space)</option>
            <option value="car">Car (3% space)</option>
            <option value="truck">Truck (5% space)</option>
          </select>
        </div>

        <div>
          <label for="vehicleNumber">Vehicle Number</label>
          <input
            type="text"
            id="vehicleNumber"
            placeholder="e.g. MH12AB1234"
            required
          />
        </div>

        <div>
          <label for="phoneNumber">Phone Number</label>
          <input
            type="number"
            id="phoneNumber"
            placeholder="e.g. 1234567890"
            required
          />
        </div>

        <div>
          <label for="owner">Owner</label>
          <input type="text" id="owner" placeholder="e.g. Rohan" required />
        </div>
        <button type="submit" id="addBtn">ADD Vehicle</button>
      </form>

      <div class="card">
        <h2>Parked Vehicles</h2>
        <table>
          <thead>
            <tr>
              <th>Type</th>
              <th>Number</th>
              <th>Owner</th>
              <th>Space</th>
                <th>Phone Number</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="vehicleTableBody"></tbody>
        </table>
        <p id="emptyText" style="color: #888; font-size: 14px">
          No vehicles parked yet.
        </p>
      </div>
    </section>
    <script src="./script.js"></script>
  </body>
</html>
